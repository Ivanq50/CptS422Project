<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- FIX: include the fragment by correct path + name -->
<div th:replace="~{fragments/nav :: topnav}"></div>

<h1>Account</h1>
<p th:if="${msg}" th:text="${msg}" style="color:#065f46"></p>

<p><b>Balance:</b> $<span th:text="${#numbers.formatDecimal(user.walletBalance,1,2)}">0.00</span></p>

<form th:action="@{/account/add-funds}" method="post">
    <label>Amount:
        <input type="number" name="amount" min="1" step="0.01" required>
    </label>
    <button type="submit">Add Funds</button>
</form>
</body>
</html>
