<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CarRentalApp • Welcome</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 0; }
        header { display:flex; justify-content:space-between; align-items:center;
            padding:14px 24px; border-bottom:1px solid #eee; }
        .brand { font-weight:700; font-size:24px; }
        nav a { margin-left:16px; text-decoration:none; }
        main { max-width:900px; margin:40px auto; padding:0 16px; }
        .card { border:1px solid #ddd; border-radius:14px; padding:24px; }
        .actions { margin-top:16px; }
        .btn { display:inline-block; padding:10px 14px; border-radius:10px; border:1px solid #ccc; text-decoration:none; }
        .btn.primary { border-color:#000; }
    </style>
</head>
<body>
<header>
    <div class="brand">CarRentalApp</div>
    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/login">Sign in</a>
    </nav>
</header>

<main>
    <h1>Welcome to CarRentalApp</h1>
    <!-- If NOT signed in -->
    <div class="card" th:if="${!signedIn}">
        <p>Create an account or sign in to start renting vehicles.</p>
        <div class="actions">
            <a class="btn primary" href="/register">Create account</a>
            <a class="btn" href="/login">Sign in</a>
        </div>
        <p style="margin-top:12px">
            Dev only: <a href="/h2" target="_blank">H2 Console</a>
            — URL <code>jdbc:h2:mem:car_rental</code>, user <code>sa</code>
        </p>
    </div>

    <!-- If signed in -->
    <div class="card" th:if="${signedIn}">
        <p>Welcome back, <b th:text="${username}">user</b>!</p>
        <div class="actions">
            <a class="btn primary" href="/cars">Browse cars</a>
        </div>
    </div>
</main>
</body>
</html>
