<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Available Vehicles</title>
</head>
<body>
<h1>Available Vehicles</h1>
<table border="1">
    <thead>
    <tr>
        <th>Make</th>
        <th>Model</th>
        <th>Type</th>
        <th>Daily Rate</th>
        <th>Available</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="vehicle : ${vehicles}">
        <td th:text="${vehicle.make}"></td>
        <td th:text="${vehicle.model}"></td>
        <td th:text="${vehicle.vehicleType}"></td>
        <td th:text="${vehicle.dailyRate}"></td>
        <td th:text="${vehicle.available}"></td>
        <td>
            <form th:action="@{/rent}" method="post">
                <input type="hidden" name="vehicleId" th:value="${vehicle.id}" />

                <label>Rental Days:
                    <input type="number" name="rentalDays" min="1" value="1" required />
                </label><br/>

                <button type="submit" th:disabled="${!vehicle.available}">Rent</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
