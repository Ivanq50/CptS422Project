<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Top nav -->
<div th:replace="~{fragments/nav :: topnav}"></div>

<h1>Vehicles</h1>

<!-- flash message -->
<p th:if="${msg}" th:text="${msg}" style="color:#065f46; margin:8px 0;"></p>

<!-- filter -->
<form method="get" th:action="@{/vehicles}" style="margin:12px 0;">
    <label>Show:
        <select name="available">
            <!-- remember selection using request param -->
            <option th:value="${null}" th:selected="${param.available == null}">All</option>
            <option value="true"  th:selected="${param.available != null and param.available[0] == 'true'}">Available</option>
            <option value="false" th:selected="${param.available != null and param.available[0] == 'false'}">Rented</option>
        </select>
    </label>
    <button type="submit">Apply</button>
</form>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>Type</th>
        <th>Make / Model</th>
        <th>Daily Rate</th>
        <th>Availability</th>
        <th>Add to Cart</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="v : ${vehicles}">
        <td th:text="${v.vehicleType}">SEDAN</td>
        <td>
            <span th:text="${v.make}">Make</span>
            <span th:text="${v.model}">Model</span>
        </td>
        <td>$<span th:text="${#numbers.formatDecimal(v.dailyRate,1,2)}">0.00</span>/day</td>
        <td th:text="${v.available ? 'Available' : 'Rented'}">Available</td>

        <td>
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="vehicleId" th:value="${v.id}">
                <label>Days:
                    <input type="number" name="days" min="1" value="1" required>
                </label>

                <!-- Disable when unavailable OR user < 25 and vehicle is LUXURY -->
                <button type="submit"
                        th:disabled="${!v.available
                                  or (currentUser != null
                                      and currentUser.age < 25
                                      and (v.vehicleType == T(org.cpts422.carrentalapp.model.VehicleType).LUXURY))}">
                    Add
                </button>
            </form>

            <!-- Inline note for the under-25 + luxury rule -->
            <small th:if="${currentUser != null
                         and currentUser.age < 25
                         and (v.vehicleType == T(org.cpts422.carrentalapp.model.VehicleType).LUXURY)}"
                   style="color:#b91c1c; display:block; margin-top:4px;">
                25+ required for LUXURY
            </small>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(vehicles)}">
        <td colspan="5">No vehicles found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
