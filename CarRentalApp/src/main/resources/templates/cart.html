<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Top bar -->
<div th:replace="~{fragments/nav :: topnav}"></div>

<h1>Cart</h1>

<!-- Flash message -->
<p th:if="${msg}" th:text="${msg}" style="color:#065f46; margin:8px 0;"></p>

<!-- When the cart is totally empty -->
<div th:if="${#lists.isEmpty(cart.items)}" style="margin-top:12px;">
    Your cart is empty.
</div>

<!-- RENT ITEMS -->
<section th:if="${!#lists.isEmpty(cart.items)}" style="margin-top:16px;">
    <h2 style="margin:8px 0;">Rentals</h2>
    <table border="1" cellpadding="6" cellspacing="0" style="min-width:920px;">
        <thead>
        <tr>
            <th>#</th>
            <th>Vehicle</th>
            <th>Days</th>
            <th>Original</th>
            <th>Discount</th>
            <th>Surcharge</th>
            <th>Final</th>
            <th>Remove</th>
        </tr>
        </thead>
        <tbody>
        <!-- show only RENT rows -->
        <tr th:each="it, idx : ${cart.items}"
            th:if="${it.type.name() == 'RENT'}">
            <td th:text="${idx.index + 1}">1</td>
            <td th:text="${it.vehicleLabel}">Make Model</td>
            <td th:text="${it.days}">1</td>

            <!-- Original (base) -->
            <td>
                $<span th:text="${it.baseAmount != null ?
                             #numbers.formatDecimal(it.baseAmount,1,2) : '0.00'}">0.00</span>
            </td>

            <!-- Discount -->
            <td>
            <span th:if="${it.discountAmount != null and it.discountAmount > 0}"
                  style="color:#065f46;">−$<span th:text="${#numbers.formatDecimal(it.discountAmount,1,2)}">0.00</span></span>
                <span th:if="${it.discountAmount == null or it.discountAmount == 0}">—</span>
            </td>

            <!-- Surcharge -->
            <td>
            <span th:if="${it.surchargeAmount != null and it.surchargeAmount > 0}"
                  style="color:#b45309;">+$<span th:text="${#numbers.formatDecimal(it.surchargeAmount,1,2)}">0.00</span></span>
                <span th:if="${it.surchargeAmount == null or it.surchargeAmount == 0}">—</span>
            </td>

            <!-- Final -->
            <td>$<span th:text="${#numbers.formatDecimal(it.amount,1,2)}">0.00</span></td>

            <td>
                <form th:action="@{/cart/remove}" method="post" style="display:inline;">
                    <input type="hidden" name="index" th:value="${idx.index}">
                    <button type="submit">Remove</button>
                </form>
            </td>
        </tr>

        <!-- fallback row if there are no RENT items -->
        <tr th:if="${!cart.hasRentItems()}">
            <td colspan="8">No rental items.</td>
        </tr>
        </tbody>
    </table>

    <!-- Checkout rentals -->
    <form th:if="${cart.hasRentItems()}"
          th:action="@{/cart/checkout-rent}" method="post"
          style="margin-top:10px;">
        <button type="submit">Checkout Rentals</button>
    </form>
</section>

<!-- PENALTY ITEMS -->
<section th:if="${!#lists.isEmpty(cart.items)}" style="margin-top:24px;">
    <h2 style="margin:8px 0;">Penalties</h2>
    <table border="1" cellpadding="6" cellspacing="0" style="min-width:720px;">
        <thead>
        <tr>
            <th>#</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Remove</th>
        </tr>
        </thead>
        <tbody>
        <!-- show only PENALTY rows -->
        <tr th:each="it, idx : ${cart.items}"
            th:if="${it.type.name() == 'PENALTY'}">
            <td th:text="${idx.index + 1}">1</td>
            <td th:text="${it.vehicleLabel}">Penalty</td>
            <td>$<span th:text="${#numbers.formatDecimal(it.amount,1,2)}">0.00</span></td>
            <td>
                <form th:action="@{/cart/remove}" method="post" style="display:inline;">
                    <input type="hidden" name="index" th:value="${idx.index}">
                    <button type="submit">Remove</button>
                </form>
            </td>
        </tr>

        <!-- fallback row if there are no PENALTY items -->
        <tr th:if="${!cart.hasPenaltyItems()}">
            <td colspan="4">No penalties to pay.</td>
        </tr>
        </tbody>
    </table>

    <!-- Checkout penalties -->
    <form th:if="${cart.hasPenaltyItems()}"
          th:action="@{/cart/checkout-return}" method="post"
          style="margin-top:10px;">
        <button type="submit">Pay Penalties & Return</button>
    </form>
</section>

<!-- GRAND TOTAL -->
<section th:if="${!#lists.isEmpty(cart.items)}" style="margin-top:24px;">
    <h3 style="margin:8px 0;">
        Total: $
        <span th:text="${#numbers.formatDecimal(cart.total(),1,2)}">0.00</span>
    </h3>
</section>
</body>
</html>
