<!DOCTYPE html>
<html th:replace="~{nav :: page(~{::body})}" lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<h1>Available Cars</h1>
<p th:if="${err}" th:text="${err}" style="color:#b91c1c"></p>
<p th:if="${msg}" th:text="${msg}" style="color:#065f46"></p>

<table>
    <tr><th>Make</th><th>Model</th><th>Type</th><th>Rate/day</th><th>Days</th><th></th></tr>
    <tr th:each="c, i : ${cars}">
        <td th:text="${c.make}">Make</td>
        <td th:text="${c.model}">Model</td>
        <td th:text="${c.vehicleType}">Type</td>
        <td th:text="${c.dailyRate}">$</td>
        <td>
            <form th:action="@{/cart/add-rent}" method="post" style="display:flex; gap:6px">
                <input type="hidden" name="vehicleId" th:value="${c.id}"/>
                <input type="number" name="days" min="1" value="1" style="width:70px"/>
                <button type="submit">Add</button>
            </form>
        </td>
        <td></td>
    </tr>
</table>
</body>
</html>
