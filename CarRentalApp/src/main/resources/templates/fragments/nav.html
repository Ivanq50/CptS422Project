<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<th:block th:fragment="topnav">
    <style>
        .topbar {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 22px; border-bottom:1px solid #eee;
        }
        .brand { font-weight:800; font-size:24px; }

        .navlinks {
            display:flex; align-items:center; gap:40px;
        }

        .menu {
            display:flex; align-items:center; gap:36px;
            flex-wrap:wrap; row-gap:8px;
        }

        .auth {
            display:flex; align-items:center; gap:16px;
            margin-left:8px;
        }

        .link { color:#5b21b6; text-decoration:none; font-weight:600; }
        .linkbutton {
            background:none; border:none; padding:0; margin:0;
            color:#5b21b6; font-weight:600; cursor:pointer;
        }
    </style>

    <div class="topbar">
        <div class="brand">CarRentalApp</div>

        <div class="navlinks">
            <!-- ✅ Home points to root "/" -->
            <a class="link" th:href="@{/}">Home</a>

            <!-- ✅ Logged OUT -->
            <div class="menu" th:if="${session.userId == null}">
                <a class="link" th:href="@{/register}">Register</a>
                <a class="link" th:href="@{/login}">Sign in</a>
            </div>

            <!-- ✅ Logged IN -->
            <div class="menu" th:if="${session.userId != null}">
                <a class="link" th:href="@{/vehicles}">Vehicles</a>
                <a class="link" th:href="@{/my-rentals}">My Rentals</a>
                <a class="link" th:href="@{/cart}">Cart</a>
                <a class="link" th:href="@{/account}">Account</a>

                <span class="auth">
                    <span>Hello, <strong th:text="${session.username}">User</strong></span>
                    <form th:action="@{/logout}" method="post" style="display:inline">
                        <button class="linkbutton" type="submit">Sign out</button>
                    </form>
                </span>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
