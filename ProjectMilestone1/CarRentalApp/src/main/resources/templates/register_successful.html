<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Account created</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
        .wrap { margin:2rem; }
        .card { max-width: 640px; padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: 12px; }
        .title { font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem; }
        .link { color: #5b21b6; text-decoration: none; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: topnav}"></div>

<div class="wrap">
    <div class="card">
        <div class="title">Your account was created</div>
        <p>You can now <a class="link" th:href="@{/login}">sign in</a>.</p>
    </div>
</div>
</body>
</html>
